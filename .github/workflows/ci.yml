name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first — no point finishing a
# run for code that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # Placeholders, not secrets. Nothing reaches Supabase or Anthropic
      # during a build; these exist only so Next has values to inline. The
      # real ones live in Vercel and must never be copied here.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder

    steps:
      # v5, not v4: GitHub now forces v4 actions onto Node 24, which they
      # were not built for. The v5 line targets it properly.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Quoted on purpose — unquoted YAML numbers lose trailing digits
          # (22.10 would become 22.1).
          node-version: "22"
          cache: npm

      # npm ci, deliberately, not npm install: it refuses to run when
      # package-lock.json and package.json disagree. That is exactly the
      # break that reached main on 2026-09-18 — a lockfile generated on macOS
      # with the Linux binaries pruned out, which would have failed the
      # Vercel deploy. This job runs on Linux for the same reason.
      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

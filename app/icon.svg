<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <!-- The AgentiX mark (components/layout/brand-logo.tsx) on a tile of the app's
       own background: the pale ribbons alone would wash out on a light tab bar. -->
  <defs>
    <linearGradient id="l" x1="8" y1="36" x2="22" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E7CFF"/><stop offset="0.55" stop-color="#8F92FF"/><stop offset="1" stop-color="#C3B4FF"/>
    </linearGradient>
    <linearGradient id="r" x1="20" y1="4" x2="33" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8A6FF"/><stop offset="0.6" stop-color="#D6B4F4"/><stop offset="1" stop-color="#F2C9E8"/>
    </linearGradient>
    <linearGradient id="s" x1="14" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="#060607"/>
  <!-- Scaled in from the edges, and without the ground glow, which is mud at 16px. -->
  <g transform="translate(3 3.2) scale(0.85)">
    <path d="M20.2 7.2 L30.6 32.4" stroke="url(#r)" stroke-width="7.4" stroke-linecap="round"/>
    <path d="M9.4 32.4 L19.8 7.2" stroke="url(#l)" stroke-width="7.4" stroke-linecap="round"/>
    <path d="M13.2 24.6 L19.2 9.6" stroke="url(#s)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <!-- The AgentiX mark (components/layout/brand-logo.tsx). The tile is part of
       the mark itself here, so the star keeps its contrast on a light tab bar. -->
  <defs>
    <linearGradient id="tile" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242A38"/><stop offset="1" stop-color="#0B0D14"/>
    </linearGradient>
    <linearGradient id="star" x1="9" y1="9" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FC2FF"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#4F8FFF"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#tile)"/>
  <!-- No glow: it is mud at 16px. -->
  <path d="M20 5.5C20 20 20 20 34.5 20 20 20 20 20 20 34.5 20 20 20 20 5.5 20 20 20 20 20 20 5.5Z" fill="url(#star)" transform="rotate(45 20 20)"/>
  <circle cx="20" cy="20" r="2.1" fill="#FFFFFF"/>
</svg>
